<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — The Jaguar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-deep: #0b2e1f;
      --green-mid: #174d34;
      --green-bright: #2a7a50;
      --gold: #90c94a;
      --gold-light: #aee070;
      --paper: #e8efd8;
      --ink: #14201a;
      --ink-soft: #3d4a43;
      --white: #ffffff;
      --rule: rgba(20,32,26,0.16);
      --font-display: 'Cormorant Garamond', serif;
      --font-body: 'DM Sans', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      background-image:
        radial-gradient(ellipse 900px 500px at 100% 0%, rgba(42,122,80,0.14) 0%, transparent 60%),
        radial-gradient(ellipse 700px 500px at 0% 40%, rgba(144,201,74,0.12) 0%, transparent 60%);
      background-attachment: fixed;
    }
    a { color: inherit; text-decoration: none; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; height: 72px; background: rgba(11,30,20,0.96); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(144,201,74,0.2); }
    .nav-logo { display: flex; align-items: center; gap: 12px; }
    .nav-logo-mark { width: 38px; height: 38px; background: var(--gold); clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--green-deep); flex-shrink: 0; }
    .nav-logo-text { display: flex; flex-direction: column; line-height: 1; }
    .nav-logo-main { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.02em; }
    .nav-logo-sub { font-size: 9px; font-weight: 500; color: var(--gold); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 2px; }
    .nav-links { display: flex; align-items: center; gap: 36px; list-style: none; }
    .nav-links a { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75); letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover { color: var(--gold); }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .btn-login { font-family: var(--font-body); font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.8); background: none; border: 1px solid rgba(255,255,255,0.25); padding: 9px 22px; border-radius: 2px; cursor: pointer; transition: all 0.2s; }
    .btn-login:hover { border-color: var(--gold); color: var(--gold); }
    .btn-signup { font-family: var(--font-body); font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--green-deep); background: var(--gold); border: none; padding: 10px 24px; border-radius: 2px; cursor: pointer; transition: background 0.2s; }
    .btn-signup:hover { background: var(--gold-light); }

    /* ARTICLE */
    .article-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 120px 32px 80px;
    }
    .article-back {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--green-bright); margin-bottom: 32px;
      transition: color 0.2s;
    }
    .article-back:hover { color: var(--ink); }
    .article-category {
      display: inline-block;
      font-size: 10px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--green-deep); background: var(--gold); padding: 5px 12px; border-radius: 40px;
      margin-bottom: 16px;
    }
    .article-title {
      font-family: var(--font-display);
      font-size: clamp(32px, 4vw, 48px); font-weight: 700;
      line-height: 1.1; color: var(--ink); margin-bottom: 16px;
    }
    .article-meta {
      display: flex; align-items: center; gap: 16px;
      font-size: 13px; color: var(--ink-soft);
      padding-bottom: 24px; margin-bottom: 32px;
      border-bottom: 1px solid var(--rule);
    }
    .article-meta strong { color: var(--ink); font-weight: 600; }
    .article-meta-dot { color: rgba(20,32,26,0.3); }
    .article-cover {
      width: 100%; border-radius: 6px; margin-bottom: 32px;
      border: 1px solid var(--rule);
    }
    .article-body h2 {
      font-family: var(--font-display);
      font-size: 26px; font-weight: 700; color: var(--ink);
      margin: 32px 0 12px; line-height: 1.2;
    }
    .article-body h3 {
      font-family: var(--font-display);
      font-size: 20px; font-weight: 700; color: var(--ink);
      margin: 24px 0 10px;
    }
    .article-body p {
      font-size: 16px; line-height: 1.8; color: var(--ink-soft);
      margin-bottom: 20px;
    }
    .article-body ul, .article-body ol {
      margin: 0 0 20px 24px;
      font-size: 16px; line-height: 1.8; color: var(--ink-soft);
    }
    .article-body blockquote {
      border-left: 3px solid var(--gold);
      padding: 8px 20px; margin: 24px 0;
      font-family: var(--font-display); font-style: italic;
      font-size: 18px; color: var(--ink); line-height: 1.5;
    }
    .article-loading {
      text-align: center; padding: 60px 0;
      font-size: 14px; color: var(--ink-soft);
    }

    @media (max-width: 900px) {
      nav { padding: 0 24px; }
      .nav-links { display: none; }
      .article-wrap { padding: 100px 24px 60px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-mark">G</div>
      <div class="nav-logo-text">
        <span class="nav-logo-main">Guyana Next Gen</span>
        <span class="nav-logo-sub">Business Exchange Forum</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="newsletter.html">The Jaguar</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn-login" id="btn-open-login">Log In</button>
      <button class="btn-signup" id="btn-open-signup">Sign Up</button>
    </div>
  </nav>

  <div class="article-wrap">
    <a href="newsletter.html" class="article-back">&larr; Back to The Jaguar</a>
    <div id="article-content">
      <div class="article-loading">Loading article...</div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const container = document.getElementById('article-content');

      if (!id) {
        container.innerHTML = '<div class="article-loading">No article specified.</div>';
        return;
      }

      try {
        const res = await fetch('/api/articles?id=' + encodeURIComponent(id));
        const data = await res.json();

        if (!res.ok || !data.article) {
          container.innerHTML = '<div class="article-loading">Article not found.</div>';
          return;
        }

        const a = data.article;
        document.title = a.title + ' — The Jaguar';

        const formatDate = (d) => {
          if (!d) return '';
          const date = new Date(d + 'T00:00:00');
          return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        };

        let bodyHtml = '';
        for (const block of a.blocks) {
          switch (block.type) {
            case 'heading_1': bodyHtml += '<h1>' + block.content + '</h1>'; break;
            case 'heading_2': bodyHtml += '<h2>' + block.content + '</h2>'; break;
            case 'heading_3': bodyHtml += '<h3>' + block.content + '</h3>'; break;
            case 'paragraph': if (block.content) bodyHtml += '<p>' + block.content + '</p>'; break;
            case 'bulleted_list_item': bodyHtml += '<ul><li>' + block.content + '</li></ul>'; break;
            case 'numbered_list_item': bodyHtml += '<ol><li>' + block.content + '</li></ol>'; break;
            case 'quote': bodyHtml += '<blockquote>' + block.content + '</blockquote>'; break;
            case 'divider': bodyHtml += '<hr style="border:none;border-top:1px solid rgba(20,32,26,0.15);margin:32px 0;" />'; break;
          }
        }

        container.innerHTML = `
          ${a.category ? '<span class="article-category">' + a.category + '</span>' : ''}
          <h1 class="article-title">${a.title}</h1>
          <div class="article-meta">
            <span>By <strong>${a.author}</strong></span>
            <span class="article-meta-dot">&middot;</span>
            <span>${formatDate(a.date)}</span>
            ${a.readTime ? '<span class="article-meta-dot">&middot;</span><span>' + a.readTime + ' read</span>' : ''}
          </div>
          ${a.coverImage ? '<img class="article-cover" src="' + a.coverImage + '" alt="" />' : ''}
          <div class="article-body">${bodyHtml}</div>
        `;
      } catch (err) {
        container.innerHTML = '<div class="article-loading">Failed to load article.</div>';
      }
    })();
  </script>

</body>
</html>
